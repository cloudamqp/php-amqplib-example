name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      lavinmq:
        image: cloudamqp/lavinmq:latest
        ports:
          - 5672:5672
          - 15672:15672
    steps:
      - uses: actions/checkout@v7

      # Building PHP with mise takes minutes; keep the version in sync with mise.toml
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: sockets, mbstring

      - name: Wait for LavinMQ
        run: |
          for _ in $(seq 60); do
            curl -sf -u guest:guest http://localhost:15672/api/overview >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Test
        run: |
          composer install --no-interaction
          composer test
